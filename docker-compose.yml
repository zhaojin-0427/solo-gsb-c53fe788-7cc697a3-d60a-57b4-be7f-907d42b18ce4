services:
  locator:
    build: .
    image: mic-tap-locator:latest
    container_name: mic-tap-locator
    ports:
      - "8000:8000"
    cpus: 2
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
